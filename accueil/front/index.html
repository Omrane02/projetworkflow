<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mémoire de France</title>
</head>
<body>
    <img src="../img/Titre.png" alt="Mémoire de France"><br>
    <p>Si votre score n'est pas la hauteur, OQTF</p>
    <div class="credentials">
        <label for="username">Entre ton Nom:</label>
        <input type="text" id="username" name="username" placeholder="Entre ton nom" maxlength="20" required>
    </div>
    <div>
        <button>Facile (5 questions)</button>
        <button>Moyen (10 questions)</button>
        <button>Difficile (20 questions)</button>
    </div>

    <div class="leaderboard">
        <h2>Classement</h2>
        <ol id="leaderboard-list">
            <li class="leaderboard-empty">Aucun score pour l'instant</li>
        </ol>
    </div>
</body>
</html>
